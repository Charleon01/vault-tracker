<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-bold p-2 rounded-lg text-xl">💳</div>
            <span class="text-xl font-bold tracking-wide">Vault<span class="text-indigo-400">Tracker</span></span>
        </div>
           <div class="flex items-center space-x-4">
               {% if user.is_authenticated %}
               <span class="text-sm text-slate-400">Welcome, <strong class="text-slate-200">{{ user.username }}</strong></span>
        
            <!-- Secure POST Logout Form -->
         <form action="{% url 'logout' %}" method="POST" class="inline">
            {% csrf_token %}
            <button type="submit" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 transition cursor-pointer">
                Logout
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg font-semibold transition">Login</a>
    {% endif %}
</div>
    </nav>






<div class="flex items-center space-x-4">
    {% if user.is_authenticated %}
        <span class="text-sm text-slate-400">Welcome, <strong class="text-slate-200">{{ user.username }}</strong></span>
        
        <!-- Secure POST Logout Form -->
        <form action="{% url 'logout' %}" method="POST" class="inline">
            {% csrf_token %}
            <button type="submit" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 transition cursor-pointer">
                Logout
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg font-semibold transition">Login</a>
    {% endif %}
</div>
















    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
